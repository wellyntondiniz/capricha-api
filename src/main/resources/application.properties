spring.application.name=ca-06-api

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/capricha?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Sessões emitidas pelo login ficam válidas por este período.
app.auth.token-ttl-hours=8
app.auth.jwt-secret=${JWT_SECRET:capricha-ca06-development-secret-change-me-32}

# Dados de demonstração locais para permitir testar o fluxo imediatamente.
app.seed-demo-data=true
