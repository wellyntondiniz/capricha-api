spring.application.name=ca-06-api

# MySQL: sobrescreva com MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER e MYSQL_PASSWORD.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:capricha}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Lts102938@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Sessões emitidas pelo login ficam válidas por este período.
app.auth.token-ttl-hours=8
app.auth.jwt-secret=${JWT_SECRET:capricha-ca06-development-secret-change-me-32}

# Dados de demonstração locais para permitir testar o fluxo imediatamente.
app.seed-demo-data=true
