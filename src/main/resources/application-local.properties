# Somente desenvolvimento: MySQL local e SMS/e-mail simulados no terminal.
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/capricha?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Cuiaba}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
app.sms.mode=console
# Use EMAIL_MODE=smtp no arquivo local de segredos para enviar de verdade.
app.email.mode=${EMAIL_MODE:console}
management.health.mail.enabled=false
